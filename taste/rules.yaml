# ============================================================================
# TASTE RULES — THIS FILE IS YOURS. The translator applies these to a song's
# analyzed structure to emit BEAT-SYNCED, loop.ts-style LED animations.
#
# Each section picks (randomly, per run) one PATTERN + one PALETTE from its lists.
# Patterns emit per-ring, beat-aligned timeframes (build-ups, sweeps, blinks,
# snakes, pulses). `randomness` controls variety; `--seed` reproduces a run.
#
# PATTERNS (all SAFE / round-trip-safe):
#   build_up       rings light up ONE BY ONE on beats and stay on (loop.ts intro)
#   accumulate     like build_up, each ring pulses once it joins (rising energy)
#   sweep          a lit ring sweeps across, one at a time, repeating
#   per_ring_blink every ring blinks on its own staggered cycle
#   snake_seg      a snake runs around a segment (centric/arc/rand/ind) on a cycle
#   pulse_beat     all rings pulse on the beat — bright, driving (drops/choruses)
#   solid_fade     one solid colour with a fade envelope (calm intros/breakdowns)
#
# PALETTES: hueRange [lo,hi] (0=red,.33=green,.66=blue; wraps if hi<lo),
#           sat/val (number or {min,max}), hueSpread = hue variation across rings.
# ============================================================================

version: 2
randomness: 0.85          # 0 = always the first option (stable); 1 = full variety

palettes:
  warm:    { hueRange: [0.95, 1.10], sat: [0.85, 1.0],  val: 1.0, hueSpread: 0.12 }   # red→orange
  hot:     { hueRange: [0.0, 0.07],  sat: 1.0,           val: 1.0, hueSpread: 0.06 }   # red/orange punch
  neon:    { hueRange: [0.80, 1.00], sat: 1.0,           val: 1.0, hueSpread: 0.20 }   # magenta/pink
  gold:    { hueRange: [0.10, 0.16], sat: [0.85, 1.0],  val: 1.0, hueSpread: 0.05 }   # amber/gold
  cool:    { hueRange: [0.52, 0.70], sat: [0.7, 0.95],  val: 1.0, hueSpread: 0.12 }   # cyan→blue
  ice:     { hueRange: [0.50, 0.62], sat: [0.35, 0.6],  val: 1.0, hueSpread: 0.08 }   # pale blue
  deep:    { hueRange: [0.66, 0.80], sat: [0.8, 1.0],   val: [0.8, 1.0], hueSpread: 0.10 } # indigo/violet
  forest:  { hueRange: [0.28, 0.42], sat: [0.7, 1.0],   val: 1.0, hueSpread: 0.10 }   # green
  sunset:  { hueRange: [0.92, 1.12], sat: [0.8, 1.0],   val: 1.0, hueSpread: 0.18 }   # pink→orange spread
  rainbow: { hueRange: [0.0, 1.0],   sat: 1.0,           val: 1.0, hueSpread: 0.9 }    # full spectrum across rings

defaults:
  patterns: [solid_fade]
  palette:  [cool]

sections:

  intro:
    patterns: [build_up, solid_fade, snake_seg]
    palette:  [cool, ice, deep]

  build:
    patterns: [build_up, accumulate, per_ring_blink, sweep]   # rising — add a ring on beats
    palette:  [warm, gold, sunset, cool]

  drop:
    patterns: [pulse_beat, per_ring_blink, accumulate, snake_seg]
    palette:  [hot, neon, warm, gold]

  breakdown:
    patterns: [solid_fade, snake_seg, sweep]
    palette:  [cool, ice, deep]

  chorus:
    patterns: [pulse_beat, snake_seg, accumulate, build_up]
    palette:  [warm, gold, sunset, neon]

  verse:
    patterns: [per_ring_blink, sweep, snake_seg, solid_fade]
    palette:  [cool, deep, forest, sunset]

  outro:
    patterns: [solid_fade, sweep]
    palette:  [ice, cool, deep]
