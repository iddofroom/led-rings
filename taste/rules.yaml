# ============================================================================
# TASTE RULES  —  THIS FILE IS YOURS. Edit it freely; it is the heart of the
# pipeline. The translator (Phase 3) applies THESE rules to a new song's
# structure. The values below are a transparent FIRST DRAFT seeded by Claude —
# every one is meant to be overwritten by you. Nothing here is "learned" or
# baked into prompts; this file is the single source of taste.
#
# Precedence: these explicit rules OVERRIDE the mined patterns in
# taste/learned-patterns.json on any conflict.
#
# HARD CONSTRAINT: only effects on the Phase 0 SAFE list may be referenced
# (docs/round-trip-contract.md section 4). The allowed palette is:
#   color:      constColor (+ "no color" = modifiers only)
#   brightness: brightness, fadeIn, fadeOut, fadeInOut, fadeOutIn, blink, pulse, fade
#   hue:        staticHueShift, hueShiftStartToEnd, hueShiftSin
#   motion:     snake, snakeHeadMove, staticSnake, snakeHeadSin, snakeHeadSteps,
#               snakeSlowFast, snakeTailShrinkGrow  (+ snakeInOut, snakeFillGrow standalone)
#   structure:  mappings all/arc/ind/b1/b2/centric/updown/rand; plain cycle;
#               phase ONLY on a color-only timeframe.
#   DO NOT USE: movement, cycleBeats, rainbow, phase-with-effects, raw FloatFunc half/comb2.
# ============================================================================

version: 1

# Global colour vocabulary you can reference by name in section rules below.
palette:
  # EDIT ME. hue is 0..1 (0=red, 0.33=green, 0.66=blue). sat/val 0..1.
  warm:   { hue_range: [0.95, 0.10], sat: 1.0,  val: 1.0 }   # red/orange (corpus is red-dominant)
  cool:   { hue_range: [0.55, 0.72], sat: 0.85, val: 1.0 }   # cyan/blue
  pastel: { hue_range: [0.55, 0.72], sat: 0.6,  val: 1.0 }

# Default applied to any section whose label has no explicit rule below.
defaults:
  intent: "hold the current mood"
  color:      { strategy: constColor, palette: cool }
  brightness: { base: brightness, value: 0.8 }
  motion:     []
  mapping:    all

# Per-section rules. Keys MUST match analyze_music.py section labels:
#   intro | build | drop | breakdown | chorus | verse | outro
sections:

  intro:
    intent: "ease in, low and calm"            # EDIT ME
    color:      { strategy: constColor, palette: cool }
    brightness: { envelope: fadeIn }
    motion:     []
    mapping:    all

  build:
    intent: "rising tension toward the drop"   # EDIT ME
    color:      { strategy: constColor, palette: warm }
    brightness: { envelope: fadeIn }
    motion:     [snakeFillGrow]                 # grows to fill — reads as accumulation
    hue:        { effect: hueShiftStartToEnd, start: 0.0, end: 0.15 }  # warm drift
    mapping:    centric
    energy_response:
      onset_density: blink_rate                 # denser onsets -> faster blink (you define the curve)

  drop:
    intent: "release / impact"                  # EDIT ME
    color:      { strategy: constColor, palette: warm, saturation: max }
    brightness: { envelope: pulse, low: 0.4, on_downbeat: spike }
    motion:     [snake]
    mapping:    all
    cycle:      { beatsInCycle: 1 }             # corpus's most common cycle

  breakdown:
    intent: "pull back, breathe, suspense"      # EDIT ME
    color:      { strategy: constColor, palette: cool }
    brightness: { envelope: fadeOutIn, low: 0.1 }
    motion:     []
    mapping:    arc

  chorus:
    intent: "bright, full, recurring hook"      # EDIT ME
    color:      { strategy: constColor, palette: warm }
    brightness: { base: brightness, value: 1.0 }
    motion:     [snakeHeadSin]
    mapping:    all

  verse:
    intent: "steady groove between peaks"       # EDIT ME
    color:      { strategy: constColor, palette: cool }
    brightness: { envelope: blink, low: 0.3 }
    motion:     []
    mapping:    all

  outro:
    intent: "wind down to dark"                 # EDIT ME
    color:      { strategy: constColor, palette: cool }
    brightness: { envelope: fadeOut }
    motion:     []
    mapping:    all
