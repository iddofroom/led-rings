name = "leds-frontdoor"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = false

# Auth gate (auth.js) — set these as SECRETS, never here (this repo is PUBLIC):
#   wrangler secret put GOOGLE_CLIENT_ID       # OAuth 2.0 Web client id
#   wrangler secret put GOOGLE_CLIENT_SECRET   # OAuth 2.0 Web client secret
#   wrangler secret put SESSION_SECRET         # random string (HMAC key for session cookies)
#   wrangler secret put ALLOWED_EMAILS         # comma-separated allowlist, e.g. a@x.com,b@y.com
#   wrangler secret put LIBRARY_API_KEY        # random key; lets local dev reach /api/library/* w/o a cookie
# Google Cloud OAuth client: authorized redirect URI https://leds.iddofroom.co.il/auth/callback,
# JS origin https://leds.iddofroom.co.il. Deploy the Worker AFTER the secrets are set (fail-closed).

[[routes]]
pattern = "leds.iddofroom.co.il/*"
zone_name = "iddofroom.co.il"

# Song library storage (MP3s, analysis, AI compositions, saved animations).
# Served by the Worker under /api/library/* (everything else proxies to the host).
[[kv_namespaces]]
binding = "LED_LIBRARY"
id = "9acd91c3ffc54c20b0aa0136fd8a719e"
