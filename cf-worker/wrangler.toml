name = "leds-frontdoor"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = false

# The React app (ui/dist) is served from the edge as Workers Static Assets — NOT proxied from the
# friend's Pi anymore. So a UI change is just a Worker redeploy (`yarn cf:deploy`); the Pi only has
# to keep running the tunnel + control-server for the LED-control /api/* calls. Build ui/dist before
# deploying. run_worker_first = true keeps worker.js authoritative (it routes /api/*, /guide, etc.,
# and falls through to env.ASSETS for the app shell); SPA fallback serves index.html for app routes.
[assets]
directory = "../ui/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Auth = Clerk (auth.js verifies the Clerk session JWT via the instance JWKS). Set these as
# SECRETS, never here (this repo is PUBLIC):
#   wrangler secret put CLERK_ISSUER      # instance Frontend API URL = the JWT `iss`, e.g.
#                                         #   https://<slug>.clerk.accounts.dev  (JWKS at $ISSUER/.well-known/jwks.json)
#   wrangler secret put OWNER_EMAIL       # bootstrap owner, admin of the built-in "rings" project (iddofroom@gmail.com)
#   wrangler secret put LIBRARY_API_KEY   # random key; local-dev superuser bypass for /api/library/*
# One-time in the Clerk dashboard: Sessions → customize the session token to include
#   "email": "{{user.primary_email_address}}"  (the Worker reads email from the verified JWT).
# The publishable key lives in the UI build env (VITE_CLERK_PUBLISHABLE_KEY), not here.

[[routes]]
pattern = "kivsee.iddofroom.co.il/*"
zone_name = "iddofroom.co.il"

# Song library storage (analysis, AI compositions, saved animations, metadata).
# Served by the Worker under /api/library/* (everything else proxies to the host).
[[kv_namespaces]]
binding = "LED_LIBRARY"
id = "9acd91c3ffc54c20b0aa0136fd8a719e"

# Audio files (MP3/WAV) live in R2, NOT KV: KV's 25 MiB value cap couldn't hold a big WAV, and
# base64 in a JSON body inflated every upload by a third. R2 has no small-object cap, takes the
# raw bytes directly, and supports HTTP Range so the player can seek without downloading the whole
# file. Metadata/compositions stay in KV above. Served through the Worker (auth unchanged) at
# /api/library/audio, never via public R2 URLs. Legacy audio still in KV is read back as a fallback.
[[r2_buckets]]
binding = "LED_AUDIO"
bucket_name = "led-library-audio"
